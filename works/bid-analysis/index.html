<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="data:,">
  <title>清标镜｜报价偏差分析</title>
  <style>
    :root{--black:#151515;--cream:#f1eadc;--orange:#f05a28;--green:#2a6a51;--line:#c6bdad;--white:#fffdf7}
    *{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--black);font-family:"Avenir Next","Hiragino Sans GB",sans-serif}
    header{display:flex;align-items:center;justify-content:space-between;height:72px;padding:0 28px;background:var(--black);color:white}.brand{font-weight:900;letter-spacing:.14em}.tag{color:#bbb6ad;font-size:13px}
    .hero{display:grid;grid-template-columns:1fr auto;align-items:end;gap:30px;padding:54px 30px 36px;border-bottom:1px solid var(--line)}.hero h1{margin:14px 0 0;font-family:"Songti SC",serif;font-size:clamp(52px,7vw,110px);line-height:.92;letter-spacing:-.07em}.eyebrow{color:var(--orange);font-size:12px;font-weight:900;letter-spacing:.18em}.hero-side{max-width:380px;padding:20px;border-left:4px solid var(--orange);line-height:1.7;color:#555047}
    .summary{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}.metric{padding:25px 30px;border-right:1px solid var(--line)}.metric strong{display:block;font-family:Georgia,serif;font-size:46px}.metric span{color:#6b655c;font-size:13px}
    .tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:22px 30px}.filter{padding:10px 16px;border:1px solid var(--black);background:transparent;cursor:pointer}.filter.active{background:var(--black);color:white}.search{margin-left:auto;min-width:250px;padding:11px 14px;border:1px solid var(--line);background:var(--white)}
    .table-wrap{margin:0 30px 60px;overflow:auto;border:1px solid var(--line);background:var(--white);box-shadow:0 18px 38px rgba(30,25,18,.08)}table{width:100%;min-width:1120px;border-collapse:collapse}th,td{padding:16px 14px;border-bottom:1px solid #ddd6ca;text-align:right;white-space:nowrap}th{position:sticky;top:0;background:#e9e1d4;color:#696258;font-size:11px;letter-spacing:.08em;text-transform:uppercase}th:nth-child(-n+2),td:nth-child(-n+2){text-align:left}.flag{display:inline-block;min-width:68px;padding:5px 9px;text-align:center;font-size:12px;font-weight:800}.high{background:#fee1d7;color:#a93b1d}.low{background:#dceade;color:#246045}.ok{color:#8a8379}.hidden{display:none}
    .foot{display:flex;justify-content:space-between;padding:28px 30px;border-top:1px solid var(--line);color:#6c665d;font-size:12px}
    @media(max-width:800px){.hero{grid-template-columns:1fr;padding:38px 18px 28px}.hero h1{font-size:60px}.summary{grid-template-columns:repeat(2,1fr)}.metric{padding:18px}.tools{padding:18px}.search{width:100%;margin-left:0}.table-wrap{margin:0 18px 40px}.foot{padding:22px 18px}}
  </style>
</head>
<body>
  <header><div class="brand">清标镜 / BID LENS</div><div class="tag">报价偏差分析 · 已完成</div></header>
  <section class="hero"><div><div class="eyebrow">PROJECT COST REVIEW / 2026</div><h1>把三家报价，<br>放到一张表里看。</h1></div><div class="hero-side">按清单编码匹配基准价与三家投标报价，计算偏差率，并把明显偏高、偏低项目直接标出。</div></section>
  <section class="summary"><div class="metric"><strong>15</strong><span>清单项目</span></div><div class="metric"><strong>3</strong><span>投标方</span></div><div class="metric"><strong>8</strong><span>异常报价</span></div><div class="metric"><strong>±30%</strong><span>异常阈值</span></div></section>
  <section class="tools"><button class="filter active" data-filter="all">全部 15</button><button class="filter" data-filter="high">只看偏高</button><button class="filter" data-filter="low">只看偏低</button><input class="search" id="search" placeholder="搜索项目名称或清单编码"></section>
  <div class="table-wrap"><table><thead><tr><th>编码</th><th>项目描述</th><th>基准价</th><th>投标方 A</th><th>A 标记</th><th>投标方 B</th><th>B 标记</th><th>投标方 C</th><th>C 标记</th></tr></thead><tbody id="rows"></tbody></table></div>
  <footer class="foot"><span>清标报价偏差分析对比表</span><span>结果基于教学样例数据 · 需由造价人员最终复核</span></footer>
  <script>
    const data=[
      ['10101001','土方开挖',35,22.16,'low',35.31,'ok',44.55,'ok'],['10101002','土方回填',28.5,20.2,'ok',26.91,'ok',35.39,'ok'],['10201001','C30混凝土浇筑',485,386.19,'ok',493.66,'ok',693.76,'high'],['10201002','C25混凝土浇筑',420,326.81,'ok',445.99,'ok',562.48,'high'],['10301001','钢筋制作安装（HRB400）',5200,3357.85,'low',4686.76,'ok',5727.35,'ok'],['10301002','钢筋制作安装（HPB300）',4800,4496.86,'ok',5093.59,'ok',6877.47,'high'],['10401001','模板制作安装',65,65.8,'ok',67.58,'ok',83.31,'ok'],['10501001','脚手架搭设',42,30.68,'ok',56.3,'high',50.29,'ok'],['10601001','砌体工程（加气块）',285,241.59,'ok',265.36,'ok',368.98,'ok'],['10701001','防水工程（SBS卷材）',78,55.41,'ok',85.13,'ok',92.11,'ok'],['10701002','防水工程（聚氨酯涂膜）',55,31.81,'low',53.2,'ok',67.75,'ok'],['10801001','外墙保温',125,109.61,'ok',114.82,'ok',169.61,'high'],['10901001','门窗工程（铝合金窗）',380,269.53,'ok',349.35,'ok',395.64,'ok'],['11001001','给排水管道安装',165,126.98,'ok',176.47,'ok',175.85,'ok'],['11101001','电气线路敷设',58,53.79,'ok',59.2,'ok',56.95,'ok']];
    const tbody=document.querySelector('#rows'),names={high:'▲ 偏高',low:'▼ 偏低',ok:'正常'};let current='all';
    const money=n=>'¥'+n.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
    function draw(){const q=document.querySelector('#search').value.trim().toLowerCase();tbody.innerHTML='';data.filter(r=>(current==='all'||r.includes(current))&&(!q||r[0].includes(q)||r[1].toLowerCase().includes(q))).forEach(r=>{const tr=document.createElement('tr');tr.innerHTML=`<td>${r[0]}</td><td>${r[1]}</td><td>${money(r[2])}</td><td>${money(r[3])}</td><td><span class="flag ${r[4]}">${names[r[4]]}</span></td><td>${money(r[5])}</td><td><span class="flag ${r[6]}">${names[r[6]]}</span></td><td>${money(r[7])}</td><td><span class="flag ${r[8]}">${names[r[8]]}</span></td>`;tbody.appendChild(tr)})}
    document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');current=b.dataset.filter;draw()});document.querySelector('#search').oninput=draw;draw();
  </script>
</body>
</html>
